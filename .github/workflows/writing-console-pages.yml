name: Writing Console Pages
run-name: Release ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Writing Console release ID
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: writing-console-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release and branch
        env:
          EXPECTED_RELEASE: ${{ inputs.release_id }}
        run: |
          python -c 'import json,os; assert json.load(open("site/release.json"))["releaseId"] == os.environ["EXPECTED_RELEASE"]'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
